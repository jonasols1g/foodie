<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy injiseres kun ved `vite build` av
      csp-meta-tag-pluginet i vite.config.ts (se kommentar der for
      begrunnelse). Injiseres den statisk her i stedet, blokkerer den
      Vites dev-server, som bruker inline <style>-tagger for HMR.
    -->
    <title>Foodie</title>
    <!--
      Schibsted Grotesk (400/500/600/700) + JetBrains Mono (400/500) —
      designtokens fra design/README.md. `preconnect` varmer opp DNS/TLS mot
      begge Google Fonts-domenene før selve stilarket lastes.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
